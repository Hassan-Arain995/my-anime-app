<html lang="en">

    <title>Gojo Infinity v9: Ultimate Hybrid</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
    <link rel="manifest" href="data:application/manifest+json;base64,eyJuYW1lIjoiR29qbyBJbmZpbml0eSB2OTogVWx0aW1hdGUgSHlicmlkIiwic2hvcnRfbmFtZSI6IkluZmluaXR5IHY5Iiwic3RhcnRfdXJsIjoiLyIsImljb25zIjpbeyJzcmMiOiJodHRwczovL3BsYWNlaG9sZGVyLml0LzE5MngxOTIucG5nIiwic2l6ZXMiOiIxOTJ4MTkyIiwidHlwZSI6ImltYWdlL3BuZyJ9XSwiYmFja2dyb3VuZF9jb2xvciI6IiMwMzAzMDMiLCJ0aGVtZV9jb2xvciI6IiMwMGYzZmYiLCJkaXNwbGF5Ijoic3RhbmRhbG9uZSJ9">
    <style>
        :root { --neon-blue: #00f3ff; --neon-purple: #9d00ff; --bg: #030303; }
        body { 
            background: var(--bg); color: white; font-family: 'Rajdhani', sans-serif;
            background-image: radial-gradient(circle at 50% 0%, #1e1b4b 0%, #020205 100%);
            min-height: 100vh; overflow-x: hidden;
        }
        .font-cyber { font-family: 'Orbitron', sans-serif; }
        .glass { background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.1); }
        .card { transition: 0.3s; border-radius: 16px; border: 1px solid rgba(255,255,255,0.05); background: black; overflow: hidden; }
        .card:hover { transform: translateY(-5px); border-color: var(--neon-blue); box-shadow: 0 0 20px rgba(0, 243, 255, 0.2); }
        .char-alya { position: fixed; bottom: -20px; left: -30px; width: 320px; opacity: 0.8; z-index: -1; pointer-events: none; }
        .char-gojo { position: fixed; top: 0; right: -50px; width: 350px; opacity: 0.2; z-index: -1; pointer-events: none; }
        .progress-bar { height: 4px; background: linear-gradient(90deg, #00f3ff, #9d00ff); width: 0%; transition: width 0.3s; }
        #toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #9d00ff; color: white; padding: 10px 20px; border-radius: 5px; display: none; font-family: 'Orbitron'; z-index: 100; }
    </style>
</head>
<body class="p-4 md:p-10 pb-40">

    <img src="https://images.squarespace-cdn.com/content/v1/5fe4caeadae61a2f1948a3d4/1612403164917-S87v688D2VUXB9K6W7G6/Satoru_Gojo_render.png" class="char-gojo">
    <img src="https://static.wikia.nocookie.net/shirayuki/images/c/c5/Alya_full_body.png" class="char-alya">

    <div class="max-w-7xl mx-auto relative z-10">
        
        <header class="flex flex-col md:flex-row justify-between items-center mb-10 glass p-6 rounded-3xl border border-cyan-500/20">
            <div>
                <h1 class="font-cyber text-3xl bg-clip-text text-transparent bg-gradient-to-r from-cyan-400 to-purple-500">INFINITY v9</h1>
                <p class="text-[10px] text-cyan-500 font-bold tracking-[0.4em] uppercase mt-1">Bulk & Discovery System</p>
            </div>
            <button onclick="enableNotif()" class="mt-4 md:mt-0 px-6 py-2 bg-cyan-500/10 border border-cyan-500 text-cyan-400 font-bold rounded-full hover:bg-cyan-500 transition">🔔 ALERTS</button>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
            
            <div class="lg:col-span-4 space-y-6">
                <div class="glass p-6 rounded-3xl border-l-4 border-purple-500">
                    <h2 class="text-sm font-cyber mb-4 text-purple-400 uppercase tracking-widest">⚡ Bulk Linker</h2>
                    <textarea id="bulkInput" placeholder="Enter list (e.g. Naruto, Bleach, One Piece)..." 
                              class="w-full bg-black/50 border border-white/10 p-4 rounded-xl h-40 text-xs outline-none focus:border-purple-500"></textarea>
                    
                    <div id="bulkStatus" class="hidden mt-3">
                        <div class="w-full bg-white/5 h-1 rounded-full mb-1"><div id="bulkProgress" class="progress-bar"></div></div>
                        <p id="bulkText" class="text-[9px] text-purple-300 uppercase font-bold text-center">Processing...</p>
                    </div>
                    
                    <button onclick="massAdd()" id="bulkBtn" class="w-full mt-3 bg-purple-600 hover:bg-purple-500 py-3 rounded-xl font-bold text-xs uppercase transition">Sync Whole List</button>
                </div>

                <div class="glass p-6 rounded-3xl border border-white/10">
                    <h3 class="text-xs font-bold text-cyan-400 uppercase tracking-widest mb-4">Quick Search</h3>
                    <input type="text" id="globalSearch" oninput="liveSearch()" placeholder="Search internet..." class="w-full bg-black/40 border border-white/10 p-3 rounded-xl text-xs outline-none">
                    <div id="searchResults" class="mt-3 space-y-2 max-h-40 overflow-y-auto"></div>
                </div>
            </div>

            <div class="lg:col-span-8 space-y-12">
                <section>
                    <h2 class="text-2xl font-bold font-cyber mb-6 flex items-center gap-3">
                        <span class="w-2 h-8 bg-cyan-500 rounded-full"></span> MY WATCHLIST
                    </h2>
                    <input type="text" id="watchSearch" oninput="renderWatchlist()" placeholder="Search watchlist..." class="w-full bg-black/40 border border-white/10 p-3 rounded-xl text-xs outline-none mb-4">
                    <div class="flex gap-2 mb-4">
                        <select id="watchGenre" onchange="renderWatchlist()" class="w-1/2 bg-black/40 border border-white/10 p-3 rounded-xl text-xs outline-none">
                            <option value="">All Genres</option>
                        </select>
                        <select id="watchSort" onchange="renderWatchlist()" class="w-1/2 bg-black/40 border border-white/10 p-3 rounded-xl text-xs outline-none">
                            <option value="title">Sort by Title</option>
                            <option value="release">Sort by Release</option>
                        </select>
                    </div>
                    <div id="myAnimeList" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
                </section>

                <section class="glass p-6 rounded-3xl border border-white/5">
                    <div class="flex flex-col md:flex-row justify-between items-center mb-6 gap-4">
                        <h2 class="text-xl font-bold font-cyber text-purple-400">DISCOVER 2026</h2>
                        <div class="flex flex-wrap gap-2">
                            <button onclick="loadSeason('2026/winter')" class="px-4 py-2 bg-white/5 hover:bg-cyan-500/20 border border-white/10 rounded-lg text-[10px] font-bold">WINTER</button>
                            <button onclick="loadSeason('2026/spring')" class="px-4 py-2 bg-white/5 hover:bg-purple-500/20 border border-white/10 rounded-lg text-[10px] font-bold">SPRING</button>
                            <button onclick="loadSeason('2026/summer')" class="px-4 py-2 bg-white/5 hover:bg-cyan-500/20 border border-white/10 rounded-lg text-[10px] font-bold">SUMMER</button>
                            <button onclick="loadSeason('2026/fall')" class="px-4 py-2 bg-white/5 hover:bg-purple-500/20 border border-white/10 rounded-lg text-[10px] font-bold">FALL</button>
                            <button onclick="loadSeason('upcoming')" class="px-4 py-2 bg-white/5 hover:bg-cyan-500/20 border border-white/10 rounded-lg text-[10px] font-bold">UPCOMING</button>
                        </div>
                    </div>
                    <div class="flex gap-2 mb-4">
                        <select id="discGenre" onchange="renderDiscovery()" class="w-1/2 bg-black/40 border border-white/10 p-3 rounded-xl text-xs outline-none">
                            <option value="">All Genres</option>
                        </select>
                        <select id="discSort" onchange="renderDiscovery()" class="w-1/2 bg-black/40 border border-white/10 p-3 rounded-xl text-xs outline-none">
                            <option value="title">Sort by Title</option>
                            <option value="release">Sort by Release</option>
                        </select>
                    </div>
                    <div id="discoveryGrid" class="grid grid-cols-2 md:grid-cols-3 gap-4"></div>
                </section>
            </div>
        </div>
    </div>

    <div id="toast"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, updateDoc, doc, deleteDoc, query, orderBy } 
        from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDYvHIugakxPULLyI85Iu_0M3_U9tW8wU",
            authDomain: "animetracker-gojo.firebaseapp.com",
            projectId: "animetracker-gojo",
            storageBucket: "animetracker-gojo.appspot.com",
            messagingSenderId: "412459430656",
            appId: "1:412459430656:web:2560368142cc5d109f2575"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const animeCol = collection(db, "myAnime");

        let trackedIds = new Set();
        let currentDiscoverData = [];
        let watchAnimes = [];

        // PWA Service Worker
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register(URL.createObjectURL(new Blob([`
                self.addEventListener('install', e => e.waitUntil(self.skipWaiting()));
                self.addEventListener('activate', e => e.waitUntil(self.clients.claim()));
                self.addEventListener('fetch', e => e.respondWith(fetch(e.request)));
            `], { type: 'application/javascript' })));
        }

        // Toast
        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.style.display = 'block';
            setTimeout(() => toast.style.display = 'none', 3000);
        }

        // Fetch Anime
        async function fetchAnime(query = '', type = '') {
            let url = query ? `https://api.jikan.moe/v4/anime?q=${query}&sfw&limit=10` : 
                      type === 'upcoming' ? 'https://api.jikan.moe/v4/seasons/upcoming' : 
                      `https://api.jikan.moe/v4/seasons/${type}`;
            const res = await fetch(url);
            const json = await res.json();
            return json.data.filter(a => {
                const year = a.year || (a.aired?.from ? new Date(a.aired.from).getFullYear() : 0);
                return year >= 2026;
            }).map(a => ({
                mal_id: a.mal_id,
                title: a.title_english || a.title,
                genres: a.genres.map(g => g.name),
                image: a.images.jpg.large_image_url,
                relDate: a.aired?.from ? a.aired.from.split('T')[0] : 'TBA',
                aired: a.episodes || 0,
                status: a.status,
                year: a.year || (a.aired?.from ? new Date(a.aired.from).getFullYear() : 0)
            }));
        }

        // Mass Add
        window.massAdd = async () => {
            const raw = document.getElementById('bulkInput').value;
            if (!raw.trim()) return;
            const names = raw.split(/[,\n]/).map(n => n.trim()).filter(n => n);
            
            const btn = document.getElementById('bulkBtn');
            const status = document.getElementById('bulkStatus');
            const bar = document.getElementById('bulkProgress');
            const txt = document.getElementById('bulkText');

            btn.disabled = true; status.classList.remove('hidden');

            for (let i = 0; i < names.length; i++) {
                const name = names[i];
                txt.innerText = `Linking: ${name}...`;
                bar.style.width = `${((i+1)/names.length)*100}%`;

                try {
                    let data = await fetchAnime(name);
                    data = data.sort((a, b) => b.year - a.year);
                    if (data.length) {
                        const a = data[0];
                        await addDoc(animeCol, {
                            title: a.title,
                            image: a.image,
                            genres: a.genres,
                            ep: 1,
                            aired: a.aired,
                            status: a.status,
                            relDate: a.relDate,
                            mal_id: a.mal_id,
                            updated: Date.now()
                        });
                        showToast('CORE LOCKED');
                    }
                } catch (e) {}
                await new Promise(r => setTimeout(r, 1000));
            }
            txt.innerText = "FINISH!";
            setTimeout(() => { status.classList.add('hidden'); btn.disabled = false; }, 2000);
            document.getElementById('bulkInput').value = '';
        };

        // Live Search
        window.liveSearch = async () => {
            const input = document.getElementById('globalSearch').value.trim();
            const results = document.getElementById('searchResults');
            results.innerHTML = '';
            if (!input) return;

            let data = await fetchAnime(input);
            data = data.sort((a, b) => b.year - a.year);

            if (data.length === 0) {
                const btn = document.createElement('button');
                btn.className = 'w-full bg-cyan-500/20 p-2 rounded text-xs';
                btn.textContent = `Add "${input}" Exactly`;
                btn.onclick = () => {
                    addDoc(animeCol, {
                        title: input,
                        image: '',
                        genres: [],
                        ep: 1,
                        aired: 0,
                        status: '',
                        relDate: '',
                        mal_id: null,
                        updated: Date.now()
                    });
                    showToast('CORE LOCKED');
                };
                results.appendChild(btn);
            } else {
                data.forEach(a => {
                    const div = document.createElement('div');
                    div.className = 'flex items-center gap-2 p-2 bg-white/5 rounded';
                    div.innerHTML = `
                        <img src="${a.image}" class="w-10 h-14 object-cover rounded">
                        <p class="text-xs flex-1">${a.title}</p>
                    `;
                    const addBtn = document.createElement('button');
                    addBtn.textContent = '+';
                    addBtn.className = 'px-2 py-1 bg-purple-500 rounded text-xs';
                    addBtn.onclick = () => {
                        addDoc(animeCol, {
                            title: a.title,
                            image: a.image,
                            genres: a.genres,
                            ep: 1,
                            aired: a.aired,
                            status: a.status,
                            relDate: a.relDate,
                            mal_id: a.mal_id,
                            updated: Date.now()
                        });
                        showToast('CORE LOCKED');
                    };
                    div.appendChild(addBtn);
                    results.appendChild(div);
                });
            }
        };

        // Load Season
        window.loadSeason = async (type) => {
            currentDiscoverData = await fetchAnime('', type);
            renderDiscovery();
        };

        // Render Discovery
        function renderDiscovery() {
            const grid = document.getElementById('discoveryGrid');
            grid.innerHTML = '';
            const genre = document.getElementById('discGenre').value;
            const sort = document.getElementById('discSort').value;
            let filtered = currentDiscoverData.filter(a => {
                return !trackedIds.has(a.mal_id) && (!genre || a.genres.includes(genre));
            });
            filtered.sort((a, b) => {
                if (sort === 'title') return a.title.localeCompare(b.title);
                if (sort === 'release') return new Date(a.relDate) - new Date(b.relDate);
                return 0;
            });
            filtered.forEach(a => {
                const div = document.createElement('div');
                div.className = 'card relative h-52 cursor-pointer group';
                div.onclick = () => {
                    addDoc(animeCol, {
                        title: a.title,
                        image: a.image,
                        genres: a.genres,
                        ep: 1,
                        aired: a.aired,
                        status: a.status,
                        relDate: a.relDate,
                        mal_id: a.mal_id,
                        updated: Date.now()
                    });
                    showToast('CORE LOCKED');
                };
                div.innerHTML = `
                    <img src="${a.image}" class="w-full h-full object-cover opacity-60 group-hover:opacity-100 transition">
                    <div class="absolute bottom-0 w-full bg-black/90 p-2 border-t border-white/10">
                        <p class="text-[10px] font-bold truncate">${a.title}</p>
                        <p class="text-[8px] text-cyan-400 font-bold uppercase mt-1">+ TRACK</p>
                    </div>
                `;
                grid.appendChild(div);
            });
            populateGenres(currentDiscoverData, 'discGenre');
        }

        // Render Watchlist
        function renderWatchlist() {
            const list = document.getElementById('myAnimeList');
            list.innerHTML = '';
            const search = document.getElementById('watchSearch').value.toLowerCase();
            const genre = document.getElementById('watchGenre').value;
            const sort = document.getElementById('watchSort').value;
            let filtered = watchAnimes.filter(a => {
                return (!search || a.title.toLowerCase().includes(search)) && (!genre || a.genres.includes(genre));
            });
            filtered.sort((a, b) => {
                if (sort === 'title') return a.title.localeCompare(b.title);
                if (sort === 'release') return new Date(a.relDate) - new Date(b.relDate);
                return 0;
            });
            filtered.forEach(a => {
                const div = document.createElement('div');
                div.className = 'glass p-3 rounded-2xl flex gap-4 border border-white/5 relative group';
                div.innerHTML = `
                    <img src="${a.image}" class="w-20 h-28 object-cover rounded-xl shadow-lg">
                    <div class="flex-1 flex flex-col justify-between py-1">
                        <div>
                            <h3 class="font-bold text-sm text-cyan-100 leading-tight truncate w-40">${a.title}</h3>
                            <div class="text-[9px] text-gray-500 mt-1 uppercase font-bold">${a.relDate || 'TBA'}</div>
                            <div class="text-[9px] text-purple-400 mt-1">Aired: ${a.aired}</div>
                        </div>
                        <div class="flex items-center gap-3">
                            <button onclick="up('\( {a.id}', \){a.ep},-1)" class="w-7 h-7 bg-white/5 rounded-lg hover:bg-white/10">-</button>
                            <span class="text-lg font-cyber font-bold text-cyan-400">${a.ep}</span>
                            <button onclick="up('\( {a.id}', \){a.ep},1)" class="w-7 h-7 bg-cyan-600 rounded-lg text-black font-bold">+</button>
                        </div>
                    </d
