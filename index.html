<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Infinity System v2.2</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
    <style>
        :root { --neon-blue: #00f3ff; --neon-purple: #9d00ff; }
        body { background: #020205; color: white; font-family: 'Rajdhani', sans-serif; min-height: 100vh; padding-bottom: 120px; background-image: radial-gradient(circle at 50% 0%, #111827 0%, #020205 100%); }
        .font-cyber { font-family: 'Orbitron', sans-serif; }
        .glass { background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(15px); border: 1px solid rgba(255,255,255,0.1); }
        .char-overlay { position: fixed; width: 320px; opacity: 0.12; z-index: -1; pointer-events: none; }
        .anime-card { background: linear-gradient(145deg, rgba(20,20,30,0.9), rgba(5,5,10,0.95)); border-radius: 24px; border: 1px solid rgba(0,243,255,0.1); }
        .btn-neon { background: linear-gradient(90deg, var(--neon-blue), var(--neon-purple)); color: black; font-weight: 900; }
        .tab-active { border-bottom: 3px solid var(--neon-blue); color: var(--neon-blue); }
        .mobile-nav { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(10,10,15,0.95); display: flex; justify-content: space-around; padding: 15px; border-top: 1px solid var(--neon-blue); z-index: 100; backdrop-filter: blur(10px); }
        .discovery-card { height: 260px; }
    </style>
</head>
<body>

    <img src="https://images.squarespace-cdn.com/content/v1/5fe4caeadae61a2f1948a3d4/1612403164917-S87N688D2VUXB9K6W7G6/Satoru_Gojo_render.png" class="char-overlay" style="top:0; left:-60px;">

    <div class="p-4 max-w-xl mx-auto">
        <header class="flex justify-between items-center mb-6 pt-2">
            <div>
                <h1 class="font-cyber text-xl text-cyan-400 tracking-tighter italic uppercase underline decoration-purple-500">Infinity System</h1>
                <p id="totalCount" class="text-[10px] font-bold text-purple-400 uppercase tracking-widest">Neural Link Synchronized</p>
            </div>
            <button onclick="requestNotifs()" class="w-10 h-10 glass rounded-full flex items-center justify-center border-cyan-500/30 text-lg shadow-[0_0_15px_rgba(0,243,255,0.2)]">🔔</button>
        </header>

        <div id="commandCenter" class="glass p-5 rounded-[2.5rem] mb-8 border-b-2 border-cyan-500">
            <input id="searchInput" type="text" placeholder="Search / Paste Mass List..." class="w-full bg-black/60 border border-white/10 p-4 rounded-2xl text-white text-sm focus:border-cyan-400 outline-none mb-4">
            <div class="flex gap-3">
                <button onclick="manualSearch()" class="flex-1 btn-neon py-3 rounded-xl text-[10px] uppercase font-black tracking-widest">Search</button>
                <button onclick="massSync()" id="syncBtn" class="flex-1 bg-white/5 border border-white/10 py-3 rounded-xl text-[10px] uppercase text-white font-bold tracking-widest">Sync List</button>
            </div>
        </div>

        <h2 class="font-cyber text-[10px] text-white mb-4 px-2 uppercase tracking-widest flex items-center gap-2">
            <span class="w-2 h-2 bg-cyan-400 rounded-full animate-pulse shadow-[0_0_8px_#00f3ff]"></span> Local Archives
        </h2>
        <div id="myAnimeList" class="space-y-4 mb-12"></div>

        <div class="mt-16">
            <div class="flex gap-8 mb-6 border-b border-white/5 px-2">
                <button onclick="loadDiscovery('now')" id="tab-now" class="pb-2 text-[10px] font-cyber tab-active uppercase">Winter 2026</button>
                <button onclick="loadDiscovery('upcoming')" id="tab-upcoming" class="pb-2 text-[10px] font-cyber text-gray-600 uppercase">Upcoming</button>
            </div>
            <div id="discoveryGrid" class="grid grid-cols-2 gap-4">
                </div>
            <div id="loader" class="text-center py-10 text-cyan-500 font-cyber text-xs animate-pulse">SCANNING SATELLITE DATA...</div>
        </div>
    </div>

    <div class="mobile-nav">
        <button onclick="window.scrollTo({top:0, behavior:'smooth'})" class="flex flex-col items-center">
            <span class="text-xl">🏠</span><span class="text-[8px] font-bold mt-1 text-cyan-400 uppercase">Home</span>
        </button>
        <button onclick="document.getElementById('commandCenter').scrollIntoView({behavior:'smooth'})" class="flex flex-col items-center">
            <span class="text-xl">🚀</span><span class="text-[8px] font-bold mt-1 uppercase">Import</span>
        </button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, updateDoc, doc, deleteDoc, query, orderBy } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDYvHIugakxPULLyI85Iu_0M3_U9tW8wU",
            authDomain: "animetracker-gojo.firebaseapp.com",
            projectId: "animetracker-gojo",
            storageBucket: "animetracker-gojo.appspot.com",
            messagingSenderId: "412459430656",
            appId: "1:412459430656:web:2560368142cc5d109f2575"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const animeCol = collection(db, "myAnime");
        let trackedIds = new Set();

        window.requestNotifs = () => {
            Notification.requestPermission().then(p => { if(p === 'granted') alert("NOTIFICATIONS LINKED! 📡"); });
        };

        // LOAD THE ENTIRE SEASON (ALL 50+)
        window.loadDiscovery = async (type) => {
            document.getElementById('tab-now').className = type === 'now' ? 'pb-2 text-[10px] font-cyber tab-active uppercase' : 'pb-2 text-[10px] font-cyber text-gray-600 uppercase';
            document.getElementById('tab-upcoming').className = type === 'upcoming' ? 'pb-2 text-[10px] font-cyber tab-active uppercase' : 'pb-2 text-[10px] font-cyber text-gray-600 uppercase';
            
            const grid = document.getElementById('discoveryGrid');
            const loader = document.getElementById('loader');
            grid.innerHTML = '';
            loader.style.display = 'block';

            try {
                // We fetch the full seasonal list from Jikan
                const res = await fetch(`https://api.jikan.moe/v4/seasons/${type === 'now' ? 'now' : 'upcoming'}`);
                const json = await res.json();
                
                // We filter out what you already have and show the rest
                const results = json.data.filter(a => !trackedIds.has(a.mal_id));
                
                results.forEach(a => {
                    const div = document.createElement('div');
                    div.className = 'glass rounded-[2rem] overflow-hidden relative discovery-card border-b-4 border-purple-600 active:scale-95 transition-all shadow-lg';
                    div.onclick = () => addAnime(a);
                    div.innerHTML = `
                        <img src="${a.images.jpg.large_image_url}" class="w-full h-full object-cover opacity-70">
                        <div class="absolute bottom-0 left-0 right-0 p-3 bg-gradient-to-t from-black via-black/90 to-transparent">
                            <p class="text-[10px] font-bold text-white uppercase leading-tight h-8 overflow-hidden">${a.title}</p>
                            <p class="text-[8px] text-cyan-400 font-black tracking-widest mt-1">+ SYNC TO CLOUD</p>
                        </div>`;
                    grid.appendChild(div);
                });
                loader.style.display = 'none';
            } catch(e) {
                loader.innerText = "SATELLITE ERROR - RETRYING...";
            }
        };

        window.addAnime = async (a) => {
            await addDoc(animeCol, {
                title: a.title_english || a.title,
                image: a.images.jpg.large_image_url,
                ep: 1, 
                date: a.aired?.from ? a.aired.from.split('T')[0] : '2026-TBA',
                mal_id: a.mal_id, 
                updated: Date.now()
            });
        };

        window.manualSearch = async () => {
            const q = document.getElementById('searchInput').value;
            if(!q) return;
            const res = await fetch(`https://api.jikan.moe/v4/anime?q=${q}&limit=1`);
            const json = await res.json();
            if(json.data?.[0]) addAnime(json.data[0]);
            document.getElementById('searchInput').value = '';
        };

        window.massSync = async () => {
            const val = document.getElementById('searchInput').value;
            if(!val) return;
            const names = val.split(/[,\n]/).map(n => n.trim()).filter(n => n);
            const btn = document.getElementById('syncBtn');
            btn.innerText = "SYNCING...";
            for(let name of names) {
                try {
                    const res = await fetch(`https://api.jikan.moe/v4/anime?q=${name}&limit=1`);
                    const json = await res.json();
                    if(json.data?.[0]) await addAnime(json.data[0]);
                    await new Promise(r => setTimeout(r, 1000));
                } catch(e){}
            }
            btn.innerText = "SYNC LIST";
            document.getElementById('searchInput').value = '';
        };

        onSnapshot(query(animeCol, orderBy("updated", "desc")), (snap) => {
            const list = document.getElementById('myAnimeList');
            list.innerHTML = ''; trackedIds.clear();
            let count = 0;
            snap.forEach(d => {
                const a = d.data(); count++;
                if(a.mal_id) trackedIds.add(a.mal_id);
                const card = document.createElement('div');
                card.className = 'anime-card p-4 flex gap-5 items-center relative overflow-hidden shadow-2xl';
                card.innerHTML = `
                    <div class="absolute top-0 right-0 w-32 h-full bg-cyan-500/5 -skew-x-12 translate-x-16"></div>
                    <img src="${a.image}" class="w-16 h-24 object-cover rounded-2xl shadow-lg z-10 border border-white/5">
                    <div class="flex-1 min-w-0 z-10">
                        <h3 class="text-[11px] font-cyber text-white truncate pr-8 uppercase italic">${a.title}</h3>
                        <p class="text-[9px] text-cyan-400/60 font-bold mt-1 uppercase tracking-tighter">DATA: ${a.date}</p>
                        <div class="flex items-center gap-6 mt-3">
                            <button onclick="up('${d.id}',${a.ep},-1)" class="w-9 h-9 rounded-xl bg-white/5 border border-white/10 flex items-center justify-center text-xl active:bg-cyan-500/20">-</button>
                            <span class="text-2xl font-cyber text-cyan-400 drop-shadow-[0_0_8px_rgba(0,243,255,0.6)]">${a.ep}</span>
                            <button onclick="up('${d.id}',${a.ep},1)" class="w-9 h-9 rounded-xl btn-neon flex items-center justify-center text-xl shadow-[0_0_15px_#00f3ff]">+</button>
                        </div>
                    </div>
                    <button onclick="del('${d.id}')" class="absolute top-2 right-4 text-white/20 text-lg">×</button>`;
                list.appendChild(card);
            });
            document.getElementById('totalCount').innerText = `${count} CORES ONLINE`;
            loadDiscovery('now');
        });

        window.up = (id, c, ch) => updateDoc(doc(db, 'myAnime', id), { ep: c+ch, updated: Date.now() });
        window.del = (id) => { if(confirm('Erase Core?')) deleteDoc(doc(db, 'myAnime', id)); };
    </script>
</body>
</html>
