<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Just Alya - Fixed Search</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
    <style>
        body { background: #050505; color: white; font-family: 'Rajdhani', sans-serif; min-height: 100vh; padding-bottom: 100px; }
        .font-cyber { font-family: 'Orbitron', sans-serif; }
        .glass { background: rgba(20, 20, 30, 0.9); border: 1px solid rgba(255,255,255,0.1); }
        .active-season { background: #00f3ff !important; color: black !important; box-shadow: 0 0 15px #00f3ff; }
        .tab-content { display: none; }
        .active-tab { display: block; }
        .nav-active { color: #00f3ff; opacity: 1 !important; filter: drop-shadow(0 0 5px #00f3ff); }
        /* Toast Notification */
        #toast { visibility: hidden; min-width: 250px; background-color: #333; color: #fff; text-align: center; border-radius: 8px; padding: 16px; position: fixed; z-index: 100; left: 50%; bottom: 100px; transform: translateX(-50%); border: 1px solid #00f3ff; }
        #toast.show { visibility: visible; animation: fadein 0.5s, fadeout 0.5s 2.5s; }
        @keyframes fadein { from {bottom: 0; opacity: 0;} to {bottom: 100px; opacity: 1;} }
        @keyframes fadeout { from {bottom: 100px; opacity: 1;} to {bottom: 0; opacity: 0;} }
    </style>
</head>
<body>

    <div id="toast">Core Updated</div>

    <div id="home-tab" class="tab-content active-tab p-4 max-w-xl mx-auto">
        <h1 class="font-cyber text-cyan-400 text-2xl mb-6 tracking-tighter">ALYA SYSTEM</h1>
        <input id="homeSearch" type="text" placeholder="Search saved cores..." class="w-full glass p-4 rounded-xl mb-6 outline-none" onkeyup="filterHome()">
        <div id="myAnimeList" class="space-y-4"></div>
    </div>

    <div id="discovery-tab" class="tab-content p-4 max-w-xl mx-auto">
        <h1 class="font-cyber text-purple-400 text-2xl mb-4">DISCOVERY</h1>
        
        <div class="glass p-4 rounded-xl mb-6 border-purple-500/30">
            <div class="flex gap-2">
                <input id="manualSearchInput" type="text" placeholder="Search name (e.g. Jack of all trades)..." class="flex-1 bg-black/50 p-3 rounded text-sm outline-none border border-white/10">
                <button onclick="performSearch()" class="bg-purple-600 px-4 rounded font-bold text-xs uppercase">Search</button>
            </div>
            <p class="text-[9px] text-gray-500 mt-2 uppercase">Search for any anime to see results below</p>
        </div>

        <div class="flex gap-2 mb-6 overflow-x-auto pb-2 no-scrollbar">
            <button id="btn-upcoming" onclick="changeSeason('upcoming')" class="active-season px-5 py-2 glass rounded-full text-[10px] font-bold uppercase whitespace-nowrap">Upcoming</button>
            <button id="btn-winter" onclick="changeSeason('winter')" class="px-5 py-2 glass rounded-full text-[10px] font-bold uppercase whitespace-nowrap">Winter 2026</button>
            <button id="btn-summer" onclick="changeSeason('summer')" class="px-5 py-2 glass rounded-full text-[10px] font-bold uppercase whitespace-nowrap">Summer 2026</button>
        </div>

        <div id="discoveryGrid" class="grid grid-cols-2 gap-4"></div>
    </div>

    <div class="fixed bottom-0 left-0 right-0 glass flex justify-around p-4 z-50 backdrop-blur-md">
        <button onclick="switchTab('home')" id="home-nav" class="nav-active flex flex-col items-center opacity-50">
            <span class="text-xl">🏠</span><span class="text-[10px] font-bold mt-1">HOME</span>
        </button>
        <button onclick="switchTab('discovery')" id="discovery-nav" class="flex flex-col items-center opacity-50">
            <span class="text-xl">🛰️</span><span class="text-[10px] font-bold mt-1">DISCOVERY</span>
        </button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, updateDoc, doc, deleteDoc, query, orderBy } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDYvHIugakxPULLyI85Iu_0M3_U9tW8wU",
            authDomain: "animetracker-gojo.firebaseapp.com",
            projectId: "animetracker-gojo",
            storageBucket: "animetracker-gojo.appspot.com",
            messagingSenderId: "412459430656",
            appId: "1:412459430656:web:2560368142cc5d109f2575"
        };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const animeCol = collection(db, "myAnime");

        function showNotify(msg) {
            const x = document.getElementById("toast");
            x.innerText = msg;
            x.className = "show";
            setTimeout(() => { x.className = x.className.replace("show", ""); }, 3000);
        }

        window.switchTab = (t) => {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active-tab'));
            document.querySelectorAll('button[id$="-nav"]').forEach(el => el.classList.remove('nav-active'));
            document.getElementById(t + '-tab').classList.add('active-tab');
            document.getElementById(t + '-nav').classList.add('nav-active');
            if(t === 'discovery') loadDiscovery();
        };

        window.changeSeason = (s) => {
            document.querySelectorAll('button[id^="btn-"]').forEach(b => b.classList.remove('active-season'));
            document.getElementById('btn-' + s).classList.add('active-season');
            loadDiscovery(s);
        };

        // RENDER DISCOVERY GRID
        function renderGrid(data) {
            const grid = document.getElementById('discoveryGrid');
            grid.innerHTML = '';
            data.forEach(a => {
                const title = a.title_english || a.title;
                const card = document.createElement('div');
                card.className = 'glass rounded-xl overflow-hidden relative h-52 group cursor-pointer';
                card.innerHTML = `
                    <img src="${a.images.jpg.large_image_url}" class="w-full h-full object-cover">
                    <div class="absolute bottom-0 w-full p-2 bg-black/80">
                        <p class="text-[10px] font-bold truncate">${title}</p>
                        <button onclick="addAnime('${title}', '${a.images.jpg.large_image_url}')" class="text-[9px] text-green-400 font-bold uppercase mt-1">+ Add to List</button>
                    </div>`;
                grid.appendChild(card);
            });
        }

        window.performSearch = async () => {
            const queryText = document.getElementById('manualSearchInput').value;
            if(!queryText) return;
            const grid = document.getElementById('discoveryGrid');
            grid.innerHTML = '<div class="col-span-2 text-center text-xs animate-pulse py-10">SEARCHING DATABASE...</div>';
            
            try {
                const res = await fetch(`https://api.jikan.moe/v4/anime?q=${encodeURIComponent(queryText)}&limit=10`);
                const json = await res.json();
                renderGrid(json.data);
            } catch(e) { showNotify("Search failed"); }
        };

        window.loadDiscovery = async (season = 'upcoming') => {
            const grid = document.getElementById('discoveryGrid');
            grid.innerHTML = '<div class="col-span-2 text-center text-xs animate-pulse py-10">SCANNING 2026 SEASON...</div>';
            
            let url = season === 'upcoming' 
                ? 'https://api.jikan.moe/v4/seasons/upcoming' 
                : `https://api.jikan.moe/v4/seasons/2026/${season}`;
            
            try {
                const res = await fetch(url);
                const json = await res.json();
                renderGrid(json.data);
            } catch(e) { grid.innerHTML = "Offline"; }
        };

        window.addAnime = async (title, img) => {
            await addDoc(animeCol, { title, image: img, ep: 1, updated: Date.now() });
            showNotify("Added: " + title);
        };

        // HOME LIST LOGIC
        onSnapshot(query(animeCol, orderBy("updated", "desc")), (snap) => {
            const list = document.getElementById('myAnimeList');
            list.innerHTML = '';
            snap.forEach(d => {
                const a = d.data();
                const div = document.createElement('div');
                div.className = 'glass p-3 rounded-xl flex gap-3 items-center relative';
                div.innerHTML = `
                    <img src="${a.image}" class="w-12 h-16 rounded object-cover shadow-lg">
                    <div class="flex-1">
                        <h3 class="text-[11px] font-bold uppercase truncate w-40 text-cyan-50">${a.title}</h3>
                        <div class="flex items-center gap-4 mt-2">
                            <button onclick="up('${d.id}',${a.ep},-1)" class="w-8 h-8 glass rounded-lg">-</button>
                            <span class="text-white font-cyber">${a.ep}</span>
                            <button onclick="up('${d.id}',${a.ep},1)" class="w-8 h-8 bg-cyan-500 text-black font-bold rounded-lg shadow-cyan-500/50 shadow-md">+</button>
                        </div>
                    </div>
                    <button onclick="del('${d.id}')" class="absolute top-2 right-2 text-gray-500 hover:text-red-500 p-2">✕</button>`;
                list.appendChild(div);
            });
        });

        window.up = (id, c, ch) => {
            if (c + ch < 0) return;
            updateDoc(doc(db, 'myAnime', id), { ep: c+ch, updated: Date.now() });
            showNotify("Episode Updated");
        };

        window.del = (id) => { if(confirm('Erase this core from memory?')) deleteDoc(doc(db, 'myAnime', id)); };
        
        loadDiscovery();
    </script>
</body>
</html>
