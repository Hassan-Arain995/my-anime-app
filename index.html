<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Infinity System v2</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
    <style>
        :root { --neon-blue: #00f3ff; --neon-purple: #9d00ff; }
        body { 
            background: #020205; color: white; font-family: 'Rajdhani', sans-serif;
            background-image: radial-gradient(circle at 50% 0%, #111827 0%, #020205 100%);
            min-height: 100vh; margin: 0; padding-bottom: 100px;
        }
        .font-cyber { font-family: 'Orbitron', sans-serif; }
        .glass { background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(15px); border: 1px solid rgba(255,255,255,0.1); }
        .char-overlay { position: fixed; width: 300px; opacity: 0.15; z-index: -1; pointer-events: none; }
        .anime-card { background: linear-gradient(145deg, rgba(20,20,30,0.9), rgba(5,5,10,0.95)); border-radius: 24px; border: 1px solid rgba(0,243,255,0.1); transition: 0.3s; }
        .btn-neon { background: linear-gradient(90deg, var(--neon-blue), var(--neon-purple)); color: black; font-weight: 900; }
        .tab-active { border-bottom: 3px solid var(--neon-blue); color: var(--neon-blue); }
        .mobile-nav { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(10,10,15,0.95); display: flex; justify-content: space-around; padding: 15px; border-top: 1px solid var(--neon-blue); z-index: 100; backdrop-filter: blur(10px); }
    </style>
</head>
<body>

    <img src="https://images.squarespace-cdn.com/content/v1/5fe4caeadae61a2f1948a3d4/1612403164917-S87N688D2VUXB9K6W7G6/Satoru_Gojo_render.png" class="char-overlay" style="top:0; left:-50px;">
    
    <div class="p-4 max-w-xl mx-auto">
        <header class="flex justify-between items-center mb-6 pt-4">
            <div>
                <h1 class="font-cyber text-xl text-cyan-400 tracking-tighter italic">INFINITY SYSTEM</h1>
                <p id="totalCount" class="text-[10px] font-bold text-purple-400 uppercase tracking-widest">Initialising Cloud...</p>
            </div>
            <div class="w-10 h-10 glass rounded-full flex items-center justify-center border-cyan-500/50">⚡</div>
        </header>

        <div id="importSection" class="glass p-5 rounded-[2rem] mb-8 border-l-4 border-cyan-500">
            <h2 class="text-[10px] font-cyber text-cyan-400 mb-3 uppercase tracking-widest">Manual Link / Mass Sync</h2>
            <input id="searchInput" type="text" placeholder="Search or paste names..." class="w-full bg-black/50 border border-white/10 p-4 rounded-2xl text-white text-sm focus:border-cyan-400 outline-none mb-3">
            <div class="flex gap-2">
                <button onclick="manualSearch()" class="flex-1 btn-neon py-3 rounded-xl text-xs uppercase tracking-tighter">Search One</button>
                <button onclick="massSync()" class="flex-1 bg-white/5 border border-white/10 py-3 rounded-xl text-xs uppercase text-white">Mass Sync</button>
            </div>
        </div>

        <h2 class="font-cyber text-xs text-white mb-4 flex items-center gap-2">
            <span class="w-2 h-2 bg-cyan-400 rounded-full animate-pulse"></span> MY CLOUD LIST
        </h2>
        <div id="myAnimeList" class="space-y-4 mb-10"></div>

        <div class="mt-12">
            <div class="flex gap-6 mb-6 border-b border-white/10">
                <button onclick="loadDiscovery('now')" id="tab-now" class="pb-2 text-xs font-cyber tab-active uppercase">Winter 2026</button>
                <button onclick="loadDiscovery('upcoming')" id="tab-upcoming" class="pb-2 text-xs font-cyber text-gray-500 uppercase">Upcoming</button>
            </div>
            <div id="discoveryGrid" class="grid grid-cols-2 gap-4"></div>
        </div>
    </div>

    <div class="mobile-nav">
        <button onclick="window.scrollTo({top:0, behavior:'smooth'})" class="flex flex-col items-center">
            <span class="text-xl">🏠</span><span class="text-[8px] font-bold mt-1">DASHBOARD</span>
        </button>
        <button onclick="document.getElementById('importSection').scrollIntoView({behavior:'smooth'})" class="flex flex-col items-center">
            <span class="text-xl">🛰️</span><span class="text-[8px] font-bold mt-1">SYNC</span>
        </button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, updateDoc, doc, deleteDoc, query, orderBy } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDYvHIugakxPULLyI85Iu_0M3_U9tW8wU",
            authDomain: "animetracker-gojo.firebaseapp.com",
            projectId: "animetracker-gojo",
            storageBucket: "animetracker-gojo.appspot.com",
            messagingSenderId: "412459430656",
            appId: "1:412459430656:web:2560368142cc5d109f2575"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const animeCol = collection(db, "myAnime");
        let trackedIds = new Set();

        // SEASONAL DISCOVERY
        window.loadDiscovery = async (type) => {
            document.getElementById('tab-now').className = type === 'now' ? 'pb-2 text-xs font-cyber tab-active uppercase' : 'pb-2 text-xs font-cyber text-gray-500 uppercase';
            document.getElementById('tab-upcoming').className = type === 'upcoming' ? 'pb-2 text-xs font-cyber tab-active uppercase' : 'pb-2 text-xs font-cyber text-gray-500 uppercase';
            
            try {
                const url = type === 'now' ? 'https://api.jikan.moe/v4/seasons/now' : 'https://api.jikan.moe/v4/seasons/upcoming';
                const res = await fetch(url);
                const json = await res.json();
                const grid = document.getElementById('discoveryGrid');
                grid.innerHTML = '';
                json.data.slice(0, 12).forEach(a => {
                    if (trackedIds.has(a.mal_id)) return;
                    const div = document.createElement('div');
                    div.className = 'glass rounded-3xl overflow-hidden relative h-52 border-b-4 border-cyan-500';
                    div.onclick = () => addAnime(a);
                    div.innerHTML = `
                        <img src="${a.images.jpg.large_image_url}" class="w-full h-full object-cover">
                        <div class="absolute bottom-0 left-0 right-0 p-3 bg-black/80 backdrop-blur-sm">
                            <p class="text-[10px] font-bold truncate text-white uppercase">${a.title}</p>
                            <p class="text-[8px] text-cyan-400 font-black tracking-widest">+ LINK DATA</p>
                        </div>`;
                    grid.appendChild(div);
                });
            } catch(e) {}
        };

        // SEARCH & SYNC
        window.manualSearch = async () => {
            const query = document.getElementById('searchInput').value;
            if(!query) return;
            const res = await fetch(`https://api.jikan.moe/v4/anime?q=${query}&limit=1`);
            const json = await res.json();
            if(json.data?.[0]) addAnime(json.data[0]);
            document.getElementById('searchInput').value = '';
        };

        window.massSync = async () => {
            const val = document.getElementById('searchInput').value;
            const names = val.split(/[,\n]/).map(n => n.trim()).filter(n => n);
            for(let name of names) {
                const res = await fetch(`https://api.jikan.moe/v4/anime?q=${name}&limit=1`);
                const json = await res.json();
                if(json.data?.[0]) await addAnime(json.data[0]);
                await new Promise(r => setTimeout(r, 1000));
            }
            document.getElementById('searchInput').value = '';
        };

        window.addAnime = async (a) => {
            await addDoc(animeCol, {
                title: a.title_english || a.title,
                image: a.images.jpg.large_image_url,
                ep: 1, mal_id: a.mal_id, updated: Date.now()
            });
        };

        // CLOUD SYNC LIST
        onSnapshot(query(animeCol, orderBy("updated", "desc")), (snap) => {
            const list = document.getElementById('myAnimeList');
            list.innerHTML = ''; trackedIds.clear();
            let count = 0;
            snap.forEach(d => {
                const a = d.data(); count++;
                if(a.mal_id) trackedIds.add(a.mal_id);
                const card = document.createElement('div');
                card.className = 'anime-card p-4 flex gap-5 items-center relative overflow-hidden';
                card.innerHTML = `
                    <div class="absolute top-0 right-0 w-24 h-full bg-cyan-500/5 -skew-x-12 transform translate-x-10"></div>
                    <img src="${a.image}" class="w-16 h-24 object-cover rounded-2xl shadow-[0_0_15px_rgba(0,0,0,0.5)] z-10">
                    <div class="flex-1 min-w-0 z-10">
                        <h3 class="text-xs font-cyber text-white truncate pr-6 uppercase italic">${a.title}</h3>
                        <div class="flex items-center gap-5 mt-4">
                            <button onclick="up('${d.id}',${a.ep},-1)" class="w-10 h-10 rounded-xl bg-white/5 border border-white/10 flex items-center justify-center text-xl">-</button>
                            <span class="text-2xl font-cyber text-cyan-400">${a.ep}</span>
                            <button onclick="up('${d.id}',${a.ep},1)" class="w-10 h-10 rounded-xl btn-neon flex items-center justify-center text-xl shadow-[0_0_10px_rgba(0,243,255,0.4)]">+</button>
                        </div>
                    </div>
                    <button onclick="del('${d.id}')" class="absolute top-2 right-3 text-white/20 text-lg">×</button>`;
                list.appendChild(card);
            });
            document.getElementById('totalCount').innerText = `${count} DATA CORES LINKED`;
            loadDiscovery('now');
        });

        window.up = (id, c, ch) => updateDoc(doc(db, 'myAnime', id), { ep: c+ch, updated: Date.now() });
        window.del = (id) => deleteDoc(doc(db, 'myAnime', id));
    </script>
</body>
</html>
