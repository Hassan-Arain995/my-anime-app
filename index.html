<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Just Alya - V9 Original</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-firestore-compat.js"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
    <style>
        body { background: #050505; color: white; font-family: 'Rajdhani', sans-serif; min-height: 100vh; padding-bottom: 100px; margin: 0; }
        .font-cyber { font-family: 'Orbitron', sans-serif; }
        .glass { background: rgba(20, 20, 30, 0.9); border: 1px solid rgba(255,255,255,0.1); }
        .tab-content { display: none; }
        .active-tab { display: block; }
        .nav-active { color: #00f3ff; filter: drop-shadow(0 0 5px #00f3ff); opacity: 1 !important; }
        
        #toast { 
            visibility: hidden; min-width: 200px; background: #111; color: #00f3ff; 
            text-align: center; border-radius: 8px; padding: 12px; position: fixed; 
            z-index: 9999; left: 50%; bottom: 90px; transform: translateX(-50%); 
            border: 1px solid #00f3ff; font-weight: bold; font-size: 11px; text-transform: uppercase;
        }
        #toast.show { visibility: visible; animation: fadein 0.5s; }
        @keyframes fadein { from {bottom: 0; opacity: 0;} to {bottom: 90px; opacity: 1;} }
    </style>
</head>
<body>

    <div id="toast">SYSTEM ONLINE</div>

    <div id="home-tab" class="tab-content active-tab p-4 max-w-xl mx-auto">
        <h1 class="font-cyber text-cyan-400 text-xl mb-4 italic tracking-widest">MY CORES</h1>
        <input id="homeSearch" type="text" placeholder="Search saved..." class="w-full glass p-3 rounded-xl mb-4 outline-none border-cyan-500/20" onkeyup="filterHome()">
        <div id="myAnimeList" class="space-y-3"></div>
    </div>

    <div id="discovery-tab" class="tab-content p-4 max-w-xl mx-auto">
        <h1 class="font-cyber text-purple-400 text-xl mb-4">DISCOVERY</h1>
        <div class="glass p-4 rounded-xl mb-6 border-purple-500/30">
            <div class="flex gap-2">
                <input id="manualSearchInput" type="text" placeholder="Search any anime..." class="flex-1 bg-black/50 p-3 rounded text-sm outline-none border border-white/10">
                <button onclick="performSearch()" class="bg-purple-600 px-4 rounded font-bold text-xs">SCAN</button>
            </div>
        </div>
        <div id="discoveryGrid" class="grid grid-cols-2 gap-4"></div>
    </div>

    <div class="fixed bottom-0 left-0 right-0 glass flex justify-around p-4 z-50 backdrop-blur-md">
        <button onclick="switchTab('home')" id="home-nav" class="nav-active flex flex-col items-center opacity-40">
            <span class="text-xl">🏠</span><span class="text-[10px] font-bold mt-1">HOME</span>
        </button>
        <button onclick="switchTab('discovery')" id="discovery-nav" class="flex flex-col items-center opacity-40">
            <span class="text-xl">🛰️</span><span class="text-[10px] font-bold mt-1">SCAN</span>
        </button>
    </div>

    <script>
        // CONFIG
        const firebaseConfig = {
            apiKey: "AIzaSyDYvHIugakxPULLyI85Iu_0M3_U9tW8wU",
            authDomain: "animetracker-gojo.firebaseapp.com",
            projectId: "animetracker-gojo",
            storageBucket: "animetracker-gojo.appspot.com",
            messagingSenderId: "412459430656",
            appId: "1:412459430656:web:2560368142cc5d109f2575"
        };

        // INITIALIZE
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const animeCol = db.collection("myAnime");

        // NOTIFICATIONS
        function showNotify(msg) {
            const x = document.getElementById("toast");
            x.innerText = msg;
            x.classList.add("show");
            setTimeout(() => { x.classList.remove("show"); }, 3000);
        }

        // TABS
        function switchTab(t) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active-tab'));
            document.querySelectorAll('button[id$="-nav"]').forEach(el => el.classList.remove('nav-active'));
            document.getElementById(t + '-tab').classList.add('active-tab');
            document.getElementById(t + '-nav').classList.add('nav-active');
        }

        // DISCOVERY SEARCH
        async function performSearch() {
            const q = document.getElementById('manualSearchInput').value;
            if(!q) return;
            const grid = document.getElementById('discoveryGrid');
            grid.innerHTML = '<div class="col-span-2 text-center text-xs py-10 animate-pulse">CONNECTING...</div>';
            
            try {
                const res = await fetch(`https://api.jikan.moe/v4/anime?q=${encodeURIComponent(q)}&limit=12`);
                const json = await res.json();
                grid.innerHTML = '';
                json.data.forEach(a => {
                    const title = a.title_english || a.title;
                    const card = document.createElement('div');
                    card.className = 'glass rounded-xl overflow-hidden relative h-48';
                    card.innerHTML = `
                        <img src="${a.images.jpg.large_image_url}" class="w-full h-full object-cover opacity-80">
                        <div class="absolute bottom-0 w-full p-2 bg-black/90">
                            <p class="text-[9px] font-bold truncate">${title}</p>
                            <button onclick="addAnime('${title.replace(/'/g, "\\'")}', '${a.images.jpg.large_image_url}')" class="text-[8px] text-cyan-400 font-bold uppercase">+ Track Core</button>
                        </div>`;
                    grid.appendChild(card);
                });
            } catch(e) { showNotify("Search Offline"); }
        }

        function addAnime(title, img) {
            animeCol.add({ title, image: img, ep: 1, updated: Date.now() })
                .then(() => showNotify("CORE LOCKED: " + title));
        }

        // HOME LIST SYNC
        animeCol.orderBy("updated", "desc").onSnapshot((snap) => {
            const list = document.getElementById('myAnimeList');
            list.innerHTML = '';
            snap.forEach(doc => {
                const a = doc.data();
                const id = doc.id;
                const div = document.createElement('div');
                div.className = 'glass p-3 rounded-xl flex gap-3 items-center relative border border-white/5';
                div.innerHTML = `
                    <img src="${a.image}" class="w-12 h-16 rounded object-cover">
                    <div class="flex-1">
                        <h3 class="text-[10px] font-bold uppercase truncate w-32 text-cyan-50">${a.title}</h3>
                        <div class="flex items-center gap-4 mt-2">
                            <button onclick="up('${id}',${a.ep},-1)" class="w-7 h-7 glass rounded">-</button>
                            <span class="text-xs font-cyber">${a.ep}</span>
                            <button onclick="up('${id}',${a.ep},1)" class="w-7 h-7 bg-cyan-500 text-black font-bold rounded shadow-lg shadow-cyan-500/20">+</button>
                        </div>
                    </div>
                    <button onclick="del('${id}')" class="absolute top-2 right-2 text-gray-700">✕</button>`;
                list.appendChild(div);
            });
        });

        function up(id, c, ch) {
            if(c+ch < 0) return;
            animeCol.doc(id).update({ ep: c+ch, updated: Date.now() })
                .then(() => showNotify("EPISODE SYNCED"));
        }

        function del(id) {
            if(confirm('Purge this core?')) {
                animeCol.doc(id).delete();
            }
        }
        
        function filterHome() {
            const q = document.getElementById('homeSearch').value.toLowerCase();
            document.querySelectorAll('#myAnimeList > div').forEach(el => {
                const text = el.querySelector('h3').innerText.toLowerCase();
                el.style.display = text.includes(q) ? 'flex' : 'none';
            });
        }
    </script>
</body>
</html>
