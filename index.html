<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INFINITY V9</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@400;500;700&display=swap" rel="stylesheet">
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'dark-bg': '#0a0a1f',
                        'purple-accent': '#9d4edd',
                        'cyan-accent': '#00f3ff',
                    },
                    fontFamily: {
                        'orbitron': ['Orbitron', 'sans-serif'],
                        'rajdhani': ['Rajdhani', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, query, where, updateDoc } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore.js";
        // Placeholder Firebase config - REPLACE WITH YOUR OWN
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_AUTH_DOMAIN",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_STORAGE_BUCKET",
            messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
            appId: "YOUR_APP_ID"
        };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        window.db = db;
    </script>
    <!-- Manifest for PWA -->
    <link rel="manifest" href="data:application/manifest+json;base64,eyJuYW1lIjoiSU5GSU5JVFkgVjkiLCJzaG9ydF9uYW1lIjoiSU5GSU5JVFkiLCJzdGFydF91cmwiOiIvIiwiaWNvbnMiOlt7InNyYyI6Imh0dHBzOi8vcGxhY2Vob2xkZXIuaXQvMTkyeDE5Mi5wbmciLCJzaXplcyI6IjE5MngxOTIiLCJ0eXBlIjoiaW1hZ2UvcG5nIn1dLCJiYWNrZ3JvdW5kX2NvbG9yIjoiIzBhMGExZiIsInRoZW1lX2NvbG9yIjoiIzlkNGVkZCIsImRpc3BsYXkiOiJzdGFuZGFsb25lIn0=">
    <style>
        body {
            background-color: #0a0a1f;
            font-family: 'Rajdhani', sans-serif;
            color: #ffffff;
        }
        .glass-morph {
            background: rgba(255, 255, 255, 0.05);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #9d4edd;
            color: #ffffff;
            padding: 10px 20px;
            border-radius: 5px;
            font-family: 'Orbitron', sans-serif;
            z-index: 1000;
            display: none;
        }
    </style>
</head>
<body class="bg-dark-bg text-white min-h-screen flex flex-col items-center justify-start p-4 font-rajdhani">
    <h1 class="text-4xl font-orbitron text-purple-accent mb-4">INFINITY V9</h1>
    <button id="alertsBtn" class="px-4 py-2 bg-cyan-accent text-dark-bg rounded mb-4">Alerts</button>
    
    <!-- Tab Navigation -->
    <div class="flex space-x-4 mb-6">
        <button id="watchlistTab" class="px-4 py-2 bg-purple-accent text-white rounded glass-morph">My Watchlist</button>
        <button id="discoveryTab" class="px-4 py-2 bg-cyan-accent text-dark-bg rounded glass-morph">Discovery</button>
    </div>
    
    <!-- Watchlist Content -->
    <div id="watchlistContent" class="w-full max-w-4xl glass-morph p-6 rounded-lg">
        <h2 class="text-2xl font-orbitron text-purple-accent mb-4">My Watchlist</h2>
        <input id="watchSearch" type="text" placeholder="Search Watchlist..." class="w-full p-2 mb-4 bg-transparent border border-cyan-accent text-white rounded">
        <select id="watchGenre" class="w-1/2 p-2 mb-4 bg-transparent border border-purple-accent text-white rounded mr-2">
            <option value="">All Genres</option>
        </select>
        <select id="watchSort" class="w-1/2 p-2 mb-4 bg-transparent border border-cyan-accent text-white rounded">
            <option value="title">Sort by Title</option>
            <option value="release">Sort by Release Date</option>
        </select>
        <div id="watchlist" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4"></div>
    </div>
    
    <!-- Discovery Content -->
    <div id="discoveryContent" class="w-full max-w-4xl glass-morph p-6 rounded-lg hidden">
        <h2 class="text-2xl font-orbitron text-cyan-accent mb-4">Discover 2026</h2>
        <input id="discSearch" type="text" placeholder="Quick Search..." class="w-full p-2 mb-4 bg-transparent border border-cyan-accent text-white rounded">
        <select id="discGenre" class="w-1/2 p-2 mb-4 bg-transparent border border-purple-accent text-white rounded mr-2">
            <option value="">All Genres</option>
        </select>
        <select id="discSort" class="w-1/2 p-2 mb-4 bg-transparent border border-cyan-accent text-white rounded">
            <option value="title">Sort by Title</option>
            <option value="release">Sort by Release Date</option>
        </select>
        <button id="winterBtn" class="px-4 py-2 bg-purple-accent text-white rounded mr-2">Winter</button>
        <button id="upcomingBtn" class="px-4 py-2 bg-cyan-accent text-dark-bg rounded">Upcoming</button>
        <h3 class="text-xl font-orbitron text-purple-accent mt-6 mb-2">Bulk Linker</h3>
        <textarea id="bulkImport" placeholder="Enter list e.g. Naruto, Bleach, One Piece..." class="w-full h-24 p-2 bg-transparent border border-purple-accent text-white rounded"></textarea>
        <button id="syncBtn" class="px-4 py-2 bg-purple-accent text-white rounded mt-2">Sync Whole List</button>
        <div id="discovery" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4 mt-6"></div>
    </div>
    
    <!-- Toast -->
    <div id="toast" class="toast"></div>
    
    <script>
        // Service Worker for PWA
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register(URL.createObjectURL(new Blob([`
                self.addEventListener('install', (event) => { event.waitUntil(self.skipWaiting()); });
                self.addEventListener('activate', (event) => { event.waitUntil(self.clients.claim()); });
                self.addEventListener('fetch', (event) => { event.respondWith(fetch(event.request)); });
            `], { type: 'application/javascript' })));
        }

        // Notification Permission
        Notification.requestPermission();

        const db = window.db;
        const collectionRef = collection(db, 'watchlist');

        // Tab Switching
        document.getElementById('watchlistTab').addEventListener('click', () => {
            document.getElementById('watchlistContent').classList.remove('hidden');
            document.getElementById('discoveryContent').classList.add('hidden');
            loadWatchlist();
        });
        document.getElementById('discoveryTab').addEventListener('click', () => {
            document.getElementById('discoveryContent').classList.remove('hidden');
            document.getElementById('watchlistContent').classList.add('hidden');
        });

        // Load Watchlist
        async function loadWatchlist(search = '', genre = '', sort = 'title') {
            const q = query(collectionRef);
            const snapshot = await getDocs(q);
            let animes = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            animes = animes.filter(anime => {
                return (!search || anime.title.toLowerCase().includes(search.toLowerCase())) &&
                       (!genre || anime.genres.includes(genre));
            });
            animes.sort((a, b) => {
                if (sort === 'title') return a.title.localeCompare(b.title);
                if (sort === 'release') return new Date(a.release) - new Date(b.release);
                return 0;
            });
            displayAnimes(animes, 'watchlist', true);
            populateGenres(animes, 'watchGenre');
        }

        // Display Animes
        function displayAnimes(animes, containerId, isWatchlist = false) {
            const container = document.getElementById(containerId);
            container.innerHTML = '';
            animes.forEach(anime => {
                const card = document.createElement('div');
                card.className = 'p-2 glass-morph rounded relative';
                card.innerHTML = `
                    <img src="\( {anime.image}" alt=" \){anime.title}" class="w-full h-40 object-cover rounded mb-2">
                    <h3 class="text-lg font-orbitron text-cyan-accent">${anime.title}</h3>
                    <p class="text-sm">Genres: ${anime.genres.join(', ')}</p>
                    <p class="text-sm">Release: ${anime.release}</p>
                    <p class="text-sm">Episodes: ${anime.episodes || 'TBA'}</p>
                    <span class="absolute top-2 right-2 bg-cyan-accent text-dark-bg px-1 rounded text-xs">${anime.episodes || 0}</span>
                `;
                if (isWatchlist) {
                    const removeBtn = document.createElement('button');
                    removeBtn.textContent = 'x';
                    removeBtn.className = 'absolute top-0 right-0 bg-red-500 text-white px-2 rounded';
                    removeBtn.onclick = () => removeFromWatchlist(anime.id);
                    card.appendChild(removeBtn);
                } else {
                    const addBtn = document.createElement('button');
                    addBtn.textContent = 'Add';
                    addBtn.className = 'px-2 py-1 bg-purple-accent text-white rounded mt-2';
                    addBtn.onclick = () => addToWatchlist(anime);
                    card.appendChild(addBtn);
                }
                container.appendChild(card);
            });
        }

        // Populate Genres
        function populateGenres(animes, selectId) {
            const genres = new Set();
            animes.forEach(anime => anime.genres.forEach(g => genres.add(g)));
            const select = document.getElementById(selectId);
            select.innerHTML = '<option value="">All Genres</option>';
            Array.from(genres).sort().forEach(g => {
                const opt = document.createElement('option');
                opt.value = g;
                opt.textContent = g;
                select.appendChild(opt);
            });
        }

        // Add to Watchlist
        async function addToWatchlist(anime) {
            try {
                const docRef = await addDoc(collectionRef, anime);
                showToast('Added to Watchlist');
                startEpisodePolling(anime.mal_id, docRef.id, anime.episodes || 0);
            } catch (e) {
                console.error(e);
            }
        }

        // Remove from Watchlist
        async function removeFromWatchlist(id) {
            await deleteDoc(doc(db, 'watchlist', id));
            loadWatchlist();
            showToast('Removed');
        }

        // Fetch Anime from Jikan
        async function fetchAnime(query = '', type = 'search') {
            let url = `https://api.jikan.moe/v4/anime?q=${query}&sfw&order_by=title&sort=asc`;
            if (type === 'upcoming') url = 'https://api.jikan.moe/v4/seasons/upcoming';
            if (type === 'winter') url = 'https://api.jikan.moe/v4/seasons/2026/winter';
            const res = await fetch(url);
            const { data } = await res.json();
            const filtered = data.filter(anime => {
                const year = anime.year || (anime.aired?.from ? new Date(anime.aired.from).getFullYear() : 0);
                return year >= 2026;
            }).map(anime => ({
                mal_id: anime.mal_id,
                title: anime.title_english || anime.title,
                genres: anime.genres.map(g => g.name),
                image: anime.images.jpg.large_image_url,
                release: anime.aired?.string || 'TBA',
                episodes: anime.episodes || 'TBA'
            }));
            return filtered;
        }

        // Load Discovery
        async function loadDiscovery(animes, genre = '', sort = 'title') {
            let filtered = animes.filter(anime => !genre || anime.genres.includes(genre));
            filtered.sort((a, b) => {
                if (sort === 'title') return a.title.localeCompare(b.title);
                if (sort === 'release') return new Date(a.release) - new Date(b.release);
                return 0;
            });
            displayAnimes(filtered, 'discovery');
            populateGenres(animes, 'discGenre');
        }

        // Event Listeners
        document.getElementById('watchSearch').addEventListener('input', e => updateWatchlist());
        document.getElementById('watchGenre').addEventListener('change', e => updateWatchlist());
        document.getElementById('watchSort').addEventListener('change', e => updateWatchlist());

        function updateWatchlist() {
            const search = document.getElementById('watchSearch').value;
            const genre = document.getElementById('watchGenre').value;
            const sort = document.getElementById('watchSort').value;
            loadWatchlist(search, genre, sort);
        }

        document.getElementById('discSearch').addEventListener('input', async e => {
            const animes = await fetchAnime(e.target.value);
            updateDiscovery(animes);
        });
        document.getElementById('discGenre').addEventListener('change', e => updateDiscovery(currentDiscoveryAnimes));
        document.getElementById('discSort').addEventListener('change', e => updateDiscovery(currentDiscoveryAnimes));

        let currentDiscoveryAnimes = [];

        function updateDiscovery(animes) {
            currentDiscoveryAnimes = animes;
            const genre = document.getElementById('discGenre').value;
            const sort = document.getElementById('discSort').value;
            loadDiscovery(animes, genre, sort);
        }

        document.getElementById('winterBtn').addEventListener('click', async () => {
            const animes = await fetchAnime('', 'winter');
            updateDiscovery(animes);
        });

        document.getElementById('upcomingBtn').addEventListener('click', async () => {
            const animes = await fetchAnime('', 'upcoming');
            updateDiscovery(animes);
        });

        // Bulk Sync
        document.getElementById('syncBtn').addEventListener('click', async () => {
            const names = document.getElementById('bulkImport').value.split(',').map(n => n.trim()).filter(n => n);
            for (let name of names) {
                const animes = await fetchAnime(name);
                if (animes.length > 0) {
                    await addToWatchlist(animes[0]);
                }
            }
            showToast('Watchlist Synced');
        });

        // Toast
        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.style.display = 'block';
            setTimeout(() => { toast.style.display = 'none'; }, 3000);
        }

        // Episode Polling for Notifications
        function startEpisodePolling(mal_id, docId, currentEpisodes) {
            setInterval(async () => {
                const res = await fetch(`https://api.jikan.moe/v4/anime/${mal_id}`);
                const { data } = await res.json();
                const newEpisodes = data.episodes || 0;
                if (newEpisodes > currentEpisodes) {
                    new Notification(`New Episode for ${data.title_english || data.title}!`);
                    showToast('New Episode Synced');
                    await updateDoc(doc(db, 'watchlist', docId), { episodes: newEpisodes });
                }
            }, 3600000); // Every hour
        }

        // Alerts Button - Simulate showing alerts
        document.getElementById('alertsBtn').addEventListener('click', () => {
            Notification.requestPermission().then(perm => {
                if (perm === 'granted') {
                    showToast('Notifications Enabled');
                }
            });
        });

        // Initial Load
        loadWatchlist();
    </script>
</body>
</html>
