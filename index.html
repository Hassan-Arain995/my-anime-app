<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="manifest" href="manifest.json">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Infinity System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
    <style>
        body { background: #020205; color: white; font-family: 'Rajdhani', sans-serif; min-height: 100vh; margin: 0; }
        .glass { background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); }
        .anime-card { background: rgba(0,0,0,0.7); border-radius: 20px; border: 1px solid rgba(255,255,255,0.05); margin-bottom: 10px; }
        .mobile-nav { position: fixed; bottom: 0; left: 0; right: 0; background: #0a0a0f; display: flex; justify-content: space-around; padding: 15px; border-top: 1px solid #00f3ff; z-index: 100; }
        .discovery-item { position: relative; border-radius: 15px; overflow: hidden; height: 180px; border: 1px solid rgba(255,255,255,0.1); }
    </style>
</head>
<body class="p-4 pb-32">

    <div class="glass p-5 rounded-3xl mb-6">
        <h1 class="text-xl font-bold text-cyan-400">INFINITY SYSTEM</h1>
        <p id="totalCount" class="text-xs text-gray-400">Syncing with Cloud...</p>
    </div>

    <div id="bulkSection" class="glass p-6 rounded-3xl mb-6">
        <h2 class="text-purple-400 text-xs font-bold mb-2 uppercase">Mass Import List</h2>
        <textarea id="bulkInput" placeholder="Paste names here..." class="w-full bg-black/40 border border-white/10 p-4 rounded-xl h-24 text-white text-xs outline-none focus:border-purple-500"></textarea>
        <button onclick="massAdd()" id="bulkBtn" class="w-full mt-3 bg-purple-600 font-bold py-3 rounded-xl text-xs uppercase active:scale-95 transition">Sync Whole List</button>
    </div>

    <h2 class="text-sm font-bold text-cyan-400 mb-4 uppercase tracking-widest">My Watchlist</h2>
    <div id="myAnimeList"></div>

    <h2 class="text-sm font-bold text-gray-500 mb-4 mt-10 uppercase tracking-widest">Suggested Anime</h2>
    <div id="discoveryGrid" class="grid grid-cols-2 gap-3 mb-10"></div>

    <div class="mobile-nav">
        <button onclick="window.scrollTo({top:0, behavior:'smooth'})" class="text-white text-[10px] font-bold">🏠 HOME</button>
        <button onclick="document.getElementById('bulkSection').scrollIntoView({behavior:'smooth'})" class="text-white text-[10px] font-bold">⚡ IMPORT</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, updateDoc, doc, deleteDoc, query, orderBy } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDYvHIugakxPULLyI85Iu_0M3_U9tW8wU",
            authDomain: "animetracker-gojo.firebaseapp.com",
            projectId: "animetracker-gojo",
            storageBucket: "animetracker-gojo.appspot.com",
            messagingSenderId: "412459430656",
            appId: "1:412459430656:web:2560368142cc5d109f2575"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const animeCol = collection(db, "myAnime");
        let trackedIds = new Set();

        // LOAD SUGGESTIONS FROM API
        async function loadSuggestions() {
            try {
                const res = await fetch('https://api.jikan.moe/v4/seasons/now?limit=10');
                const json = await res.json();
                const grid = document.getElementById('discoveryGrid');
                grid.innerHTML = '';
                json.data.forEach(a => {
                    if (trackedIds.has(a.mal_id)) return;
                    const div = document.createElement('div');
                    div.className = 'discovery-item';
                    div.onclick = () => addOne(a);
                    div.innerHTML = `
                        <img src="${a.images.jpg.image_url}" class="w-full h-full object-cover opacity-60">
                        <div class="absolute bottom-0 left-0 right-0 p-2 bg-black/80">
                            <p class="text-[10px] font-bold truncate">${a.title}</p>
                            <p class="text-[8px] text-cyan-400 uppercase font-black">+ Add to List</p>
                        </div>`;
                    grid.appendChild(div);
                });
            } catch(e) {}
        }

        window.addOne = async (a) => {
            await addDoc(animeCol, { 
                title: a.title, 
                image: a.images.jpg.image_url, 
                ep: 1, 
                mal_id: a.mal_id,
                updated: Date.now() 
            });
        };

        window.massAdd = async () => {
            const val = document.getElementById('bulkInput').value;
            const names = val.split(/[,\n]/).map(n => n.trim()).filter(n => n);
            document.getElementById('bulkBtn').innerText = "Processing...";
            for(let name of names) {
                try {
                    const res = await fetch(`https://api.jikan.moe/v4/anime?q=${name}&limit=1`);
                    const json = await res.json();
                    if(json.data?.[0]) {
                        await addOne(json.data[0]);
                    }
                } catch(e){}
                await new Promise(r => setTimeout(r, 1000));
            }
            document.getElementById('bulkBtn').innerText = "Sync Whole List";
            document.getElementById('bulkInput').value = '';
        };

        onSnapshot(query(animeCol, orderBy("updated", "desc")), (snap) => {
            const list = document.getElementById('myAnimeList');
            list.innerHTML = '';
            trackedIds.clear();
            let count = 0;
            snap.forEach(d => {
                const a = d.data(); count++;
                if(a.mal_id) trackedIds.add(a.mal_id);
                const div = document.createElement('div');
                div.className = 'anime-card p-4 flex gap-4 items-center';
                div.innerHTML = `
                    <img src="${a.image}" class="w-12 h-16 object-cover rounded-lg shadow-lg">
                    <div class="flex-1 min-w-0">
                        <h3 class="text-xs font-bold truncate text-white uppercase">${a.title}</h3>
                        <div class="flex items-center gap-4 mt-2">
                            <button onclick="up('${d.id}',${a.ep},-1)" class="w-8 h-8 bg-white/10 rounded-lg">-</button>
                            <span class="font-bold text-cyan-400 text-lg">${a.ep}</span>
                            <button onclick="up('${d.id}',${a.ep},1)" class="w-8 h-8 bg-cyan-600 text-black font-black rounded-lg">+</button>
                        </div>
                    </div>
                    <button onclick="del('${d.id}')" class="text-white/20 p-2">✕</button>`;
                list.appendChild(div);
            });
            document.getElementById('totalCount').innerText = `${count} Anime Saved to Cloud`;
            loadSuggestions();
        });

        window.up = (id, c, ch) => updateDoc(doc(db, 'myAnime', id), { ep: c+ch, updated: Date.now() });
        window.del = (id) => deleteDoc(doc(db, 'myAnime', id));
    </script>
</body>
</html>
