<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JUST ALYA</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@400;500;700&display=swap" rel="stylesheet">
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'cyber-black': '#050505',
                        'cyber-cyan': '#00f3ff',
                        'cyber-purple': '#a855f7',
                    },
                    fontFamily: {
                        'orbitron': ['Orbitron', 'sans-serif'],
                        'rajdhani': ['Rajdhani', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, query, where } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore.js";
        // Placeholder Firebase config - REPLACE WITH YOUR OWN
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_AUTH_DOMAIN",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_STORAGE_BUCKET",
            messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
            appId: "YOUR_APP_ID"
        };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        window.db = db; // Expose for JS use
    </script>
    <!-- Manifest for PWA -->
    <link rel="manifest" href="data:application/manifest+json;base64,eyJuYW1lIjoiSlVTVCBBTFlBIiwiY29udGVudCI6IkFuaW1lIFRyYWNrZXIiLCJzaG9ydF9uYW1lIjoiQUxZQSIsInN0YXJ0X3VybCI6Ii8iLCJkaXNwbGF5Ijoic3RhbmRhbG9uZSIsImJhY2tncm91bmRfY29sb3IiOiIjMDUwNTA1IiwidGhlbWVfY29sb3IiOiIjMDBmM2ZmIiwiaWNvbnMiOlt7InNyYyI6Imh0dHBzOi8vcGxhY2Vob2xkZXIuaXQvMTkyeDE5Mi5wbmciLCJzaXplcyI6IjE5MngxOTIiLCJ0eXBlIjoiaW1hZ2UvcG5nIn1dfQ==">
    <style>
        body {
            background-color: #050505;
            font-family: 'Rajdhani', sans-serif;
            color: #ffffff;
        }
        .glass-morph {
            background: rgba(255, 255, 255, 0.05);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #00f3ff;
            color: #050505;
            padding: 10px 20px;
            border-radius: 5px;
            font-family: 'Orbitron', sans-serif;
            z-index: 1000;
            display: none;
        }
    </style>
</head>
<body class="bg-cyber-black text-white min-h-screen flex flex-col items-center justify-start p-4 font-rajdhani">
    <h1 class="text-4xl font-orbitron text-cyber-cyan mb-8">JUST ALYA</h1>
    
    <!-- Tab Navigation -->
    <div class="flex space-x-4 mb-6">
        <button id="homeTab" class="px-4 py-2 bg-cyber-purple text-white rounded glass-morph">HOME</button>
        <button id="scanTab" class="px-4 py-2 bg-cyber-cyan text-black rounded glass-morph">SCAN</button>
    </div>
    
    <!-- Home Tab Content -->
    <div id="homeContent" class="w-full max-w-4xl glass-morph p-6 rounded-lg">
        <h2 class="text-2xl font-orbitron text-cyber-purple mb-4">My Cores</h2>
        <input id="homeSearch" type="text" placeholder="Search My Cores..." class="w-full p-2 mb-4 bg-transparent border border-cyber-cyan text-white rounded">
        <select id="genreFilter" class="w-full p-2 mb-4 bg-transparent border border-cyber-purple text-white rounded">
            <option value="">All Genres</option>
            <!-- Genres will be populated dynamically -->
        </select>
        <div id="myCores" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"></div>
    </div>
    
    <!-- Scan Tab Content -->
    <div id="scanContent" class="w-full max-w-4xl glass-morph p-6 rounded-lg hidden">
        <h2 class="text-2xl font-orbitron text-cyber-cyan mb-4">Discovery Scan</h2>
        <input id="scanSearch" type="text" placeholder="Search Anime..." class="w-full p-2 mb-4 bg-transparent border border-cyber-cyan text-white rounded">
        <button id="upcomingBtn" class="px-4 py-2 bg-cyber-purple text-white rounded mr-2">Upcoming</button>
        <button id="winter2026Btn" class="px-4 py-2 bg-cyber-cyan text-black rounded">Winter 2026</button>
        <textarea id="massImport" placeholder="Paste anime names, one per line..." class="w-full h-32 p-2 mt-4 bg-transparent border border-cyber-purple text-white rounded"></textarea>
        <button id="importBtn" class="px-4 py-2 bg-cyber-purple text-white rounded mt-2">Mass Import</button>
        <button id="addExactBtn" class="px-4 py-2 bg-cyber-cyan text-black rounded mt-2 ml-2">Add Name Exactly As Typed</button>
        <div id="scanResults" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 mt-6"></div>
    </div>
    
    <!-- Toast -->
    <div id="toast" class="toast"></div>
    
    <script>
        // Service Worker for PWA
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register(URL.createObjectURL(new Blob([`
                self.addEventListener('install', (event) => {
                    event.waitUntil(self.skipWaiting());
                });
                self.addEventListener('activate', (event) => {
                    event.waitUntil(self.clients.claim());
                });
                self.addEventListener('fetch', (event) => {
                    event.respondWith(fetch(event.request));
                });
            `], { type: 'application/javascript' })));
        }

        // Notification Permission
        Notification.requestPermission();

        const db = window.db;
        const collectionRef = collection(db, 'cores');

        // Tab Switching
        document.getElementById('homeTab').addEventListener('click', () => {
            document.getElementById('homeContent').classList.remove('hidden');
            document.getElementById('scanContent').classList.add('hidden');
            loadMyCores();
        });
        document.getElementById('scanTab').addEventListener('click', () => {
            document.getElementById('scanContent').classList.remove('hidden');
            document.getElementById('homeContent').classList.add('hidden');
        });

        // Load My Cores
        async function loadMyCores(search = '', genre = '') {
            const q = query(collectionRef);
            const snapshot = await getDocs(q);
            const cores = snapshot.docs.map(doc => doc.data());
            let filtered = cores.filter(anime => {
                return (!search || anime.title.toLowerCase().includes(search.toLowerCase())) &&
                       (!genre || (anime.genres && anime.genres.includes(genre)));
            });
            displayCores(filtered, 'myCores');
            populateGenres(cores);
        }

        function populateGenres(cores) {
            const genres = new Set();
            cores.forEach(anime => {
                if (anime.genres) anime.genres.forEach(g => genres.add(g));
            });
            const select = document.getElementById('genreFilter');
            select.innerHTML = '<option value="">All Genres</option>';
            genres.forEach(g => {
                const opt = document.createElement('option');
                opt.value = g;
                opt.textContent = g;
                select.appendChild(opt);
            });
        }

        // Display Cores
        function displayCores(animes, containerId) {
            const container = document.getElementById(containerId);
            container.innerHTML = '';
            animes.forEach(anime => {
                const card = document.createElement('div');
                card.className = 'p-4 glass-morph rounded';
                card.innerHTML = `
                    <h3 class="text-xl font-orbitron text-cyber-cyan">${anime.title}</h3>
                    <p>Genres: ${anime.genres ? anime.genres.join(', ') : 'N/A'}</p>
                    <p>Release: ${anime.releaseYear}</p>
                `;
                if (containerId === 'scanResults') {
                    const addBtn = document.createElement('button');
                    addBtn.textContent = 'Add to Cores';
                    addBtn.className = 'px-2 py-1 bg-cyber-purple text-white rounded mt-2';
                    addBtn.onclick = () => addToCores(anime);
                    card.appendChild(addBtn);
                }
                container.appendChild(card);
            });
        }

        // Add to Cores
        async function addToCores(anime) {
            try {
                await addDoc(collectionRef, anime);
                showToast('CORE LOCKED');
                checkForNotifications(anime);
            } catch (e) {
                console.error(e);
            }
        }

        // Jikan API Fetch with 2026 Filter
        async function fetchAnime(query, type = 'search') {
            let url = `https://api.jikan.moe/v4/anime?q=${query}&sfw`;
            if (type === 'upcoming') url = 'https://api.jikan.moe/v4/seasons/upcoming';
            if (type === 'winter2026') url = 'https://api.jikan.moe/v4/seasons/2026/winter';
            const res = await fetch(url);
            const data = await res.json();
            const filtered = (data.data || []).filter(anime => {
                const year = anime.year || (anime.aired && new Date(anime.aired.from).getFullYear()) || 0;
                return year >= 2026;
            }).map(anime => ({
                title: anime.title,
                genres: anime.genres ? anime.genres.map(g => g.name) : [],
                releaseYear: anime.year || new Date(anime.aired.from).getFullYear()
            }));
            return filtered;
        }

        // Search Handlers
        document.getElementById('homeSearch').addEventListener('input', (e) => {
            loadMyCores(e.target.value, document.getElementById('genreFilter').value);
        });
        document.getElementById('genreFilter').addEventListener('change', (e) => {
            loadMyCores(document.getElementById('homeSearch').value, e.target.value);
        });

        document.getElementById('scanSearch').addEventListener('input', async (e) => {
            const animes = await fetchAnime(e.target.value);
            displayCores(animes, 'scanResults');
        });

        document.getElementById('upcomingBtn').addEventListener('click', async () => {
            const animes = await fetchAnime('', 'upcoming');
            displayCores(animes, 'scanResults');
        });

        document.getElementById('winter2026Btn').addEventListener('click', async () => {
            const animes = await fetchAnime('', 'winter2026');
            displayCores(animes, 'scanResults');
        });

        // Mass Import
        document.getElementById('importBtn').addEventListener('click', async () => {
            const names = document.getElementById('massImport').value.split('\n').filter(n => n.trim());
            for (let name of names) {
                const animes = await fetchAnime(name);
                if (animes.length > 0) {
                    await addToCores(animes[0]); // Add first match
                }
            }
            showToast('CORES IMPORTED');
        });

        // Add Exact
        document.getElementById('addExactBtn').addEventListener('click', () => {
            const name = document.getElementById('scanSearch').value.trim();
            if (name) {
                addToCores({ title: name, genres: [], releaseYear: 2026 });
                showToast('CORE LOCKED EXACTLY');
            }
        });

        // Toast
        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.style.display = 'block';
            setTimeout(() => { toast.style.display = 'none'; }, 3000);
        }

        // Simulated Notification for Episode Release (Poll every 5min)
        function checkForNotifications(anime) {
            // Simulate: In real, poll Jikan for episodes
            setInterval(async () => {
                const res = await fetch(`https://api.jikan.moe/v4/anime?q=${anime.title}&sfw`);
                const data = await res.json();
                // Assume check for new episodes
                if (Math.random() > 0.9) { // Simulated new episode
                    new Notification(`New Episode for ${anime.title}!`);
                    showToast('EPISODE SYNCED');
                }
            }, 300000); // 5min
        }

        // Initial Load
        loadMyCores();
    </script>
</body>
</html>
